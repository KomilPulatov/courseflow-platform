<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professor Sections</title>
    <link rel="stylesheet" href="/portal-assets/css/main.css" />
  </head>
  <body>
    <header class="portal-header">
      <div class="portal-header__inner">
        <div class="logo-wrap">
          <img src="/portal-assets/images/iut-logo.gif" alt="Inha University in Tashkent" />
        </div>
        <div class="header-links">
          <a id="headerTimetableLink" href="/professor/timetable" hidden>Timetable</a>
          <span id="headerLinksDivider" class="header-links__divider" hidden>|</span>
          <a href="https://class.inha.uz/" target="_blank" rel="noreferrer">e-Class</a>
          <button id="logoutButton" class="logout-button" type="button" hidden>Logout</button>
        </div>
      </div>
    </header>

    <div class="portal-layout">
      <aside class="portal-sidebar">
        <div class="sidebar-profile">
          <div id="sidebarSchool" class="sidebar-profile__school">Professor Portal</div>
          <div id="sidebarProfessorName" class="sidebar-profile__name">Professor Session Required</div>
          <div id="sidebarProfileMeta" class="sidebar-profile__meta"></div>
          <div id="sidebarSessionHint" class="sidebar-profile__hint">
            Sign in to load your department, assigned sections, room options, and timetable.
          </div>
        </div>
        <nav id="sidebarNav" class="sidebar-nav">
          <a class="sidebar-nav__item" href="/professor"><span>Professor Home</span><span class="sidebar-nav__plus">+</span></a>
          <a class="sidebar-nav__item is-active" href="/professor/sections"><span>My Sections</span><span class="sidebar-nav__plus">+</span></a>
          <a class="sidebar-nav__item" href="/professor/timetable"><span>Timetable</span><span class="sidebar-nav__plus">+</span></a>
        </nav>
      </aside>

      <main
        class="portal-main"
        data-page-heading="My Sections"
        data-page-description="Sign in to review the sections currently assigned to your professor account."
      >
        <div id="pageAlert" class="inline-alert is-hidden"></div>
        <section id="loginCard" class="login-card">
          <h3>Professor Sign In</h3>
          <p class="helper-text">Authenticate to load assigned sections.</p>
          <form id="professorLoginForm" class="form-grid">
            <input name="email" type="email" value="professor@crsp.example.com" required />
            <input name="password" type="password" value="prof12345" required />
            <button class="button" type="submit">Sign in</button>
          </form>
        </section>
        <div id="pageContent"></div>
      </main>

      <aside class="portal-aside">
        <div class="stack-lg">
          <section class="panel-box">
            <div class="panel-box__head">Link Sites</div>
            <div id="linkSites" class="panel-box__body"></div>
          </section>
          <section class="panel-box">
            <div class="panel-box__head">Help Desk</div>
            <div id="helpDesk" class="panel-box__body"></div>
          </section>
        </div>
      </aside>
    </div>

    <script type="module" src="/portal-assets/js/pages/sections.js"></script>
  </body>
</html>
